# Pre-verify the c-iouring submission exactly like the challenge CI does:
# install.sh + test/run.sh (build, start, 197 conformance checks) on a clean
# ubuntu-24.04 against Postgres 18 and the 2% dev seed.
name: conformance
on:
  workflow_dispatch:
  push:
    branches: [bench, c-iouring-sub]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env: { PGHOST: 127.0.0.1, PGPORT: 5432, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: bench/go.mod, cache-dependency-path: bench/go.sum }
      - name: tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client curl jq
      - name: seed
        run: bash seed/make-seed.sh --dev
      - name: install.sh
        run: sudo bash submissions/c-iouring-ssmurfgg04-gif/install.sh
      - name: build, start, test
        run: bash test/run.sh submissions/c-iouring-ssmurfgg04-gif
